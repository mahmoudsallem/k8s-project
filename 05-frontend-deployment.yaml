apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: forntend
  labels:
    app: frontend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: salem7ouda/frontend:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        
        # Resource management
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        
